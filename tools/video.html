<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Creator | AI Creator Hub</title>

    <meta
        name="description"
        content="AI Video Creator - Tạo nội dung video bằng AI"
    >
</head>

<body>

    <header>
        <a href="../index.html">← AI Creator Hub</a>

        <h1>🎬 Video Creator</h1>

        <p>Tạo kịch bản và prompt video bằng AI</p>
    </header>

    <main>

        <form id="videoCreatorForm">

            <div>
                <label for="topic">Chủ đề</label>

                <input
                    type="text"
                    id="topic"
                    name="topic"
                    placeholder="Ví dụ: Dạy con cách nói lời từ chối"
                    required
                >
            </div>


            <div>
                <label for="audience">Đối tượng</label>

                <input
                    type="text"
                    id="audience"
                    name="audience"
                    placeholder="Ví dụ: Phụ huynh có con 6-12 tuổi"
                    required
                >
            </div>


            <div>
                <label for="painPoint">Nỗi đau / vấn đề</label>

                <textarea
                    id="painPoint"
                    name="painPoint"
                    placeholder="Người dùng đang gặp vấn đề gì?"
                    required
                ></textarea>
            </div>


            <div>
                <label for="situation">Tình huống</label>

                <textarea
                    id="situation"
                    name="situation"
                    placeholder="Mô tả tình huống cụ thể..."
                ></textarea>
            </div>


            <div>
                <label for="format">Format</label>

                <select id="format" name="format">
                    <option value="reels">Facebook Reels</option>
                    <option value="tiktok">TikTok</option>
                    <option value="shorts">YouTube Shorts</option>
                </select>
            </div>


            <div>
                <label for="duration">Thời lượng</label>

                <select id="duration" name="duration">
                    <option value="15">15 giây</option>
                    <option value="30" selected>30 giây</option>
                    <option value="45">45 giây</option>
                    <option value="60">60 giây</option>
                </select>
            </div>


            <div>
                <label for="scenes">Số cảnh</label>

                <select id="scenes" name="scenes">
                    <option value="3">3 cảnh</option>
                    <option value="5" selected>5 cảnh</option>
                    <option value="7">7 cảnh</option>
                    <option value="10">10 cảnh</option>
                </select>
            </div>


            <div>
                <label for="style">Phong cách</label>

                <select id="style" name="style">
                    <option value="natural">Tự nhiên</option>
                    <option value="educational">Giáo dục</option>
                    <option value="storytelling">Kể chuyện</option>
                    <option value="emotional">Cảm xúc</option>
                    <option value="professional">Chuyên nghiệp</option>
                </select>
            </div>


            <button type="submit">
                ✨ Tạo nội dung
            </button>

        </form>


        <section id="result" hidden>

            <h2>Kết quả</h2>

            <div id="resultContent"></div>

        </section>

    </main>


    <script src="../js/tools/video.js"></script>

</body>
</html>
